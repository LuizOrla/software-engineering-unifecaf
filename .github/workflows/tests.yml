name: Testes Automatizados (GUI & Storage)
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Baixar o código do repositório
      uses: actions/checkout@v4
    - name: Configurar o Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Instalar dependências do Python
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Instalar Navegadores do Playwright
      run: |
        # Instala o navegador Chromium headless necessário para testar o NiceGUI
        python -m playwright install --with-deps chromium
    - name: Executar todos os testes (Storage e GUI)
      run: |
        # Executa o pytest rodando a interface em segundo plano
        pytest --headless
